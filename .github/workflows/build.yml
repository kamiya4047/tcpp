name: Windows and portable validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset windows
      - run: cmake --build --preset ${{ matrix.configuration == 'Debug' && 'debug' || 'release' }} --parallel
      - run: ctest --preset ${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
      - if: matrix.configuration == 'Release'
        run: build/windows/Release/decoder_cli.exe --benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.configuration }}
          path: |
            build/windows/${{ matrix.configuration }}/*.exe
            build/windows/src/windows_tsf/${{ matrix.configuration }}/*
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset portable
      - run: cmake --build build/portable --parallel
      - run: ctest --test-dir build/portable --output-on-failure
